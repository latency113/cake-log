services:
  # ╭─ postgres ─────────────────────────────────────────────────────────╮
  postgres:
    image: postgres
    container_name: postgres
    restart: unless-stopped # unless-stopped, on-failure, always, "no"
    user: postgres
    volumes:
      - ./db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=nvccake
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - set it in backend/.env}
      - POSTGRES_USER=postgres
    healthcheck:
      test: ["CMD", "pg_isready", -U, postgres]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port published: app containers reach postgres over the compose network.
    # If you must connect from the host, bind to localhost only: "127.0.0.1:5432:5432"
    networks:
      - app_net

  # ╰─ postgres ─────────────────────────────────────────────────────────╯

  # ╭─ postgres admin ───────────────────────────────────────────────────╮
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - "127.0.0.1:8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nvccake.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD missing - set it in backend/.env}
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    networks:
      - app_net
  # ╰─ postgres admin ───────────────────────────────────────────────────╯

networks:
  app_net:
    external: true

volumes:
  db-data:
  pgadmin: